<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="crypto-lab: CBC padding oracle attack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="1" stop-color="#161b27"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#7c5cbf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#lock)"/>

  <!-- padlock glyph -->
  <g transform="translate(150 250)">
    <path d="M20 90 v-30 a45 45 0 0 1 85 -19"
          fill="none" stroke="#8b99b5" stroke-width="16" stroke-linecap="round"/>
    <rect x="-8" y="86" width="120" height="92" rx="16" fill="url(#lock)"/>
    <circle cx="52" cy="126" r="15" fill="#0f1117"/>
    <rect x="45" y="130" width="14" height="30" rx="7" fill="#0f1117"/>
  </g>

  <!-- wordmark -->
  <text x="340" y="270" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="34" letter-spacing="6" fill="#4a9eff">CRYPTO-LAB</text>
  <text x="340" y="350" font-family="system-ui, sans-serif"
        font-size="72" font-weight="700" fill="#e6eaf4">Padding Oracle Attack</text>
  <text x="340" y="410" font-family="system-ui, sans-serif"
        font-size="30" fill="#a0aec0">Decrypt AES-CBC without the key — Vaudenay 2002</text>

  <!-- oracle bit strip -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26">
    <rect x="340" y="452" width="150" height="52" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <text x="415" y="486" fill="#4ade80" text-anchor="middle">VALID</text>
    <rect x="506" y="452" width="150" height="52" rx="10" fill="#2d0a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="581" y="486" fill="#f87171" text-anchor="middle">INVALID</text>
    <text x="686" y="486" fill="#8b99b5">← one bit is enough</text>
  </g>
</svg>
