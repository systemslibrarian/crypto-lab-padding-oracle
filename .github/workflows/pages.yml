name: Build, verify, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Repository code always runs read-only. Only no-checkout control-plane jobs
# receive the narrow write permissions needed to deploy or merge.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are disposable; an in-flight main deployment is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run type-check
      - run: npm test
      - run: npm run test:workflow
      - run: npm run build

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run type-check
      - run: npm test
      - run: npm run test:workflow
      - run: npm run build

  browser:
    needs: [quality, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser claims and WCAG A/AA gates
        run: npm run test:a11y
      - name: Package the tested site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  mutation:
    needs: [quality, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Replay every recorded claim mutation
        run: npm run test:mutations
      - name: Preserve exact mutation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: padding-oracle-mutation-evidence-${{ github.sha }}
          path: |
            mutation-evidence.json
            mutation-logs/
          if-no-files-found: error
          retention-days: 30

  # Keep this job id stable: existing branch rules and reviewers know `build`.
  # It runs no repository code and fails closed unless every source-controlled
  # quality, compatibility, browser, and mutation job succeeded.
  build:
    needs: [quality, compatibility, browser, mutation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every upstream gate to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: |
          for result in "$QUALITY_RESULT" "$COMPATIBILITY_RESULT" "$BROWSER_RESULT" "$MUTATION_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::an upstream required gate concluded $result"
              exit 1
            fi
          done

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment

  # This job never checks out or runs dependency-controlled repository code
  # with write authority. Major updates remain open for human review.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      - name: Leave major updates for human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo 'Major update left open for human review.'
      - name: Reject an unrecognized Dependabot update type
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.meta.outputs.update-type != 'version-update:semver-minor' &&
          steps.meta.outputs.update-type != 'version-update:semver-patch'
        run: exit 1
      - name: Merge a gated patch or minor update
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          merged=false
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              state="$(gh pr view "$PR_URL" --json state --jq .state)"
              if [ "$state" = MERGED ]; then
                merged=true
                break
              fi
            fi
            echo "merge attempt $attempt did not land; retrying after the base branch settles"
            sleep 15
          done
          if [ "$merged" != true ]; then
            echo "::error::gate passed, but the Dependabot PR did not merge after 3 attempts"
            exit 1
          fi
          if ! gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main; then
            echo "::error::merge landed, but the required deploy workflow did not dispatch"
            exit 1
          fi
